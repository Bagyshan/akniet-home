root /usr/share/nginx/html;
index index.html;
charset utf-8;
absolute_redirect off;
client_max_body_size 64k;
include /etc/nginx/snippets/headers.conf;

location = /ky { return 301 /ky/; }
location ~ ^/(ky/)?(technology|map|projects|extras|invest|catalog)$ { return 301 $uri/; }
# only the site pages: /admin/ has its own index.html and must keep serving it
location ~ ^/(ky/)?((?:technology|map|projects|extras|invest|catalog)/)?index\.html$ { return 301 /$1$2; }

# ---- Pages: rendered by the backend with the admin content and SEO tags.
# If the backend is down, the static copy is served, so the site keeps working.
location = / {
    proxy_pass http://backend/ssr/ru;
    include /etc/nginx/snippets/proxy-headers.conf;
    proxy_set_header X-Admin-User "";
    proxy_intercept_errors on;
    error_page 500 502 503 504 = @static_page;
}
location = /ky/ {
    proxy_pass http://backend/ssr/ky;
    include /etc/nginx/snippets/proxy-headers.conf;
    proxy_set_header X-Admin-User "";
    proxy_intercept_errors on;
    error_page 500 502 503 504 = @static_page;
}
location ~ ^/(technology|map|projects|extras|invest|catalog)/$ {
    proxy_pass http://backend/ssr/ru/$1;
    include /etc/nginx/snippets/proxy-headers.conf;
    proxy_set_header X-Admin-User "";
    proxy_intercept_errors on;
    error_page 500 502 503 504 = @static_page;
}
location ~ ^/ky/(technology|map|projects|extras|invest|catalog)/$ {
    proxy_pass http://backend/ssr/ky/$1;
    include /etc/nginx/snippets/proxy-headers.conf;
    proxy_set_header X-Admin-User "";
    proxy_intercept_errors on;
    error_page 500 502 503 504 = @static_page;
}
# /map/ → /map/index.html (the address always ends with a slash here)
location @static_page { try_files ${uri}index.html =503; add_header Cache-Control "no-cache"; include /etc/nginx/snippets/headers.conf; }

location = /robots.txt { proxy_pass http://backend/robots.txt; include /etc/nginx/snippets/proxy-headers.conf; }
location = /sitemap.xml { proxy_pass http://backend/sitemap.xml; include /etc/nginx/snippets/proxy-headers.conf; }
location = /site.webmanifest {
    types { application/manifest+json webmanifest; }
    add_header Cache-Control "public, max-age=86400";
    include /etc/nginx/snippets/headers.conf;
}

error_page 404 /404.html;
location = /404.html { internal; add_header Cache-Control "no-cache"; include /etc/nginx/snippets/headers.conf; }

location / {
    try_files $uri $uri/ =404;
    add_header Cache-Control "no-cache";
    include /etc/nginx/snippets/headers.conf;
}

# Scripts and styles: the browser revalidates every time (ETag), so an update is seen at once
location ~* ^/assets/.+\.(js|css)$ {
    add_header Cache-Control "no-cache";
    include /etc/nginx/snippets/headers.conf;
}

# Images: file names are not hashed, so a week of cache; a changed image gets a new name
location /assets/ {
    expires 7d;
    add_header Cache-Control "public";
    include /etc/nginx/snippets/headers.conf;
}

# Photos uploaded in the admin panel; the name is a hash of the content, so it never changes
location /uploads/ {
    alias /srv/uploads/;
    expires 30d;
    add_header Cache-Control "public, immutable";
    include /etc/nginx/snippets/headers.conf;
}

# ---- API ----
location = /api/leads {
    limit_req zone=leads burst=5 nodelay;
    proxy_set_header X-Admin-User "";
    include /etc/nginx/snippets/proxy.conf;
}

location /api/ {
    proxy_set_header X-Admin-User "";
    include /etc/nginx/snippets/proxy.conf;
}

# ---- Admin: basic auth (login/password from ADMIN_USER / ADMIN_PASSWORD) ----
location = /api/admin/upload {
    auth_basic "Akniet admin";
    auth_basic_user_file /etc/nginx/.htpasswd;
    client_max_body_size 16m;
    proxy_set_header X-Admin-User $remote_user;
    include /etc/nginx/snippets/proxy.conf;
}

location /api/admin/ {
    auth_basic "Akniet admin";
    auth_basic_user_file /etc/nginx/.htpasswd;
    proxy_set_header X-Admin-User $remote_user;
    include /etc/nginx/snippets/proxy.conf;
}

location = /admin { return 301 /admin/; }
location /admin/ {
    auth_basic "Akniet admin";
    auth_basic_user_file /etc/nginx/.htpasswd;
    alias /usr/share/nginx/admin/;
    add_header Cache-Control "no-store";
    add_header X-Robots-Tag "noindex, nofollow";
    include /etc/nginx/snippets/headers.conf;
}
