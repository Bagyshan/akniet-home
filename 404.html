<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Страница не найдена — Акниет</title>
<meta name="theme-color" content="#211e22">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/favicon-32.png">
<link rel="stylesheet" href="/assets/fonts/fonts.css">
<style>
:root{--ink:#312d32;--page:#211e22;--cream:#fff8ec;--gold:#d5a039}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--page);color:var(--cream);font:16px/1.6 "Onest",system-ui,sans-serif}
main{width:min(640px,100%);padding:clamp(28px,5vw,56px);border-radius:28px;background:var(--ink);box-shadow:inset 0 0 0 1px rgba(255,248,236,.08)}
.logo{display:flex;align-items:center;gap:10px;font:500 15px "Unbounded",sans-serif;letter-spacing:.18em;color:inherit;text-decoration:none}
.logo img{width:26px}
.code{margin:36px 0 8px;font:300 clamp(72px,14vw,120px)/1 "Unbounded",sans-serif;letter-spacing:-.05em;color:var(--gold)}
h1{margin:0;font:400 clamp(24px,4vw,34px)/1.15 "Unbounded",sans-serif;letter-spacing:-.02em}
p{margin:12px 0 0;color:rgba(255,248,236,.66)}
.btns{display:flex;flex-wrap:wrap;gap:10px;margin-top:28px}
a.btn{display:inline-flex;align-items:center;min-height:48px;padding:0 22px;border-radius:999px;font-weight:600;text-decoration:none;color:var(--ink);background:var(--gold)}
a.btn.ghost{color:var(--cream);background:rgba(255,248,236,.1);box-shadow:inset 0 0 0 1px rgba(255,248,236,.25)}
</style>
</head>
<body>
<main>
  <a class="logo" href="/"><img src="/assets/mark-gold.png" alt="">АКНИЕТ</a>
  <div class="code">404</div>
  <h1>Страница не найдена</h1>
  <p>Возможно, ссылка устарела. Барнхаусы, A-frame, цены и контакты — на главной.</p>
  <p lang="ky">Бет табылган жок. Барнхаус, A-frame, баалар жана байланыш — башкы бетте.</p>
  <div class="btns"><a class="btn" href="/">На главную</a><a class="btn ghost" href="/ky/" lang="ky">Башкы бет (кыргызча)</a></div>
</main>
</body>
</html>
